    <path fill="#626e60" d="M83 1041C297 745 173 488 441 297 579 199 820 241 860 71L925 970Z"/>
    <path fill="#353e35" d="M271 1040C561 740 322 490 547 398 632 363 762 421 841 335L833 992Z"/>
    <path fill="#181c19" d="M433 1014C621 813 451 674 597 584 715 511 775 612 840 533L840 1000Z"/>
    <path fill="#f2f1e9" d="M57-35C258 166 181 342 116 493 78 579 85 671 45 765 56 587 12 551 44 382 79 193 139 148 57-35Z"/>
    <path stroke="#f2f1e9" stroke-opacity=".45" stroke-width="1.2" d="M134 964C394 660 236 449 477 286 623 188 791 231 813 117M297 986C560 743 356 490 558 411 668 368 750 429 806 378M458 976C613 820 468 662 615 589 703 545 775 603 817 562"/>
