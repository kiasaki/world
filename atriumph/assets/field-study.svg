<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 960" fill="none">
  <title>Field study</title>
  <desc>An original abstract study of folded organic forms in six green-gray tones, with fine procedural grain.</desc>
  <defs>
    <filter id="grain" x="0" y="0" width="100%" height="100%">
      <feTurbulence type="fractalNoise" baseFrequency=".72" numOctaves="3" seed="23" stitchTiles="stitch"/>
      <feColorMatrix type="saturate" values="0"/>
      <feComponentTransfer><feFuncA type="linear" slope=".2"/></feComponentTransfer>
      <feBlend in="SourceGraphic" mode="multiply"/>
    </filter>
    <clipPath id="frame"><path d="M0 0H800V960H0z"/></clipPath>
  </defs>
  <g clip-path="url(#frame)" filter="url(#grain)">
    <path fill="#c5c9be" d="M0 0H800V960H0z"/>
